name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax check JS files
        run: |
          node --check app.js
          node --check sync.js
          node --check sw.js
          node --check app/content/motivationProgramV2.js

      - name: Check panel.html script tag balance
        run: |
          OPEN=$(grep -o '<script' panel.html | wc -l)
          CLOSE=$(grep -o '</script>' panel.html | wc -l)
          echo "script open=$OPEN close=$CLOSE"
          [ "$OPEN" -eq "$CLOSE" ]

      - name: Headless render test
        run: node .claude/skills/run-seyma/driver.mjs

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Depo koku oldugu gibi yayinlaniyordu: docs/ (1.0 MB), tests/ (1.8 MB),
      # .claude/ (692 KB ajan harness'lari) ve archive/ (528 KB) dahil ~4.2 MB
      # ic malzeme herkese acik URL'de servis ediliyordu. Calisma zamaninda
      # hicbiri kullanilmiyor; app.js'in cektigi tek .md dosyasi Pages'ten degil
      # veri repo'sundan GitHub API ile geliyor.
      - name: Stage runtime-only site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude 'docs' \
            --exclude 'tests' \
            --exclude 'archive' \
            --exclude '_site' \
            --exclude '*.md' \
            ./ _site/
          # This standalone page is intentionally kept under archive/ in the
          # repository, but is published at the stable public URL expected by
          # existing links.
          install -Dm644 archive/demos/profil-degerlendirme-174.html \
            _site/profil-degerlendirme-174.html
          echo "--- staged size ---"
          du -sh _site

      # Yanlislikla bir calisma zamani dosyasi dislanirsa deploy SESSIZCE bozuk
      # site yayinlamasin: temel varliklar yoksa is burada duser.
      - name: Guard runtime assets present
        run: |
          for f in index.html panel.html panel-v2.html app.js sync.js app/styles.css \
                   panel/panel.js panel/panel.css sw.js manifest.json \
                   app/core/constants.js panel/panelCoverageManifest.js \
                   panel/v2/panel-v2.js panel/v2/panel-v2.css \
                   app/content/profileAssessmentV1.js \
                   app/content/quranRevelationOrderV1.js \
                   assets/aeon-icon-192.png assets/aeon-icon-512.png \
                   profil-degerlendirme-174.html; do
            [ -f "_site/$f" ] || { echo "EKSIK: $f"; exit 1; }
          done
          [ -z "$(find _site -name '*.md' -print -quit)" ] || { echo "_site icinde .md kaldi"; exit 1; }
          for d in docs tests archive .claude; do
            [ ! -e "_site/$d" ] || { echo "_site icinde $d kaldi"; exit 1; }
          done
          echo "runtime guard OK"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
