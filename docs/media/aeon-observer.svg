<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ÆON observer interface preview</title>
  <desc id="desc">An observer dashboard preview showing freshness, safe projection status, redaction and a bounded event timeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d13"/><stop offset="1" stop-color="#121c25"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f1bd72"/><stop offset="1" stop-color="#ff7f93"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".32"/></filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .title{fill:#f5f7fa;font-weight:700;letter-spacing:-.02em}
      .body{fill:#d7dee6}
      .muted{fill:#82919f}
      .tiny{fill:#82919f;font-size:12px;letter-spacing:.14em}
      .card{fill:#121b24;stroke:#263542;stroke-width:1}
    </style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <rect x="30" y="30" width="1140" height="700" rx="24" fill="#0c131b" stroke="#293744"/>
  <rect x="52" y="52" width="1096" height="70" rx="18" fill="#101922"/>
  <circle cx="88" cy="87" r="22" fill="#f1bd72" opacity=".16"/>
  <text x="88" y="94" text-anchor="middle" class="sans title" font-size="20">Æ</text>
  <text x="126" y="82" class="sans title" font-size="19">ÆON</text>
  <text x="126" y="101" class="sans muted" font-size="11" letter-spacing=".12em">ORCHESTRATION CORE · OBSERVER</text>
  <rect x="934" y="72" width="184" height="31" rx="15" fill="#18362f" stroke="#2a6657"/>
  <circle cx="953" cy="87" r="5" fill="#73d6b2"/>
  <text x="967" y="92" class="sans" fill="#9fe4ca" font-size="11">PROJECTION FRESH</text>

  <g transform="translate(52 148)" class="sans">
    <text x="0" y="28" class="tiny">CURRENT PANEL / TODAY</text>
    <text x="0" y="72" class="title" font-size="36">Signals with provenance.</text>
    <text x="0" y="100" class="muted" font-size="15">Readable operational context without pretending to know more than the source.</text>

    <rect x="0" y="132" width="334" height="145" rx="20" class="card" filter="url(#shadow)"/>
    <text x="24" y="168" class="tiny">SOURCE STATE</text>
    <text x="24" y="210" class="title" font-size="29">Fresh</text>
    <text x="24" y="238" class="body" font-size="14">revision 2026-08-22 · local projection</text>
    <path d="M260 214 A42 42 0 1 1 259.9 213.9" fill="none" stroke="#263542" stroke-width="9"/>
    <path d="M260 214 A42 42 0 0 1 295 190" fill="none" stroke="#73d6b2" stroke-width="9" stroke-linecap="round"/>

    <rect x="354" y="132" width="334" height="145" rx="20" class="card"/>
    <text x="378" y="168" class="tiny">DAILY SIGNAL</text>
    <text x="378" y="210" class="title" font-size="29">4.0 / 5</text>
    <text x="378" y="238" class="body" font-size="14">aggregate mood index · seven-day view</text>
    <path d="M592 231 C612 211 624 224 644 202 S674 185 688 211" fill="none" stroke="#ff7f93" stroke-width="3"/>
    <circle cx="688" cy="211" r="5" fill="#ff7f93"/>

    <rect x="708" y="132" width="388" height="145" rx="20" fill="#211b25" stroke="#523544"/>
    <text x="732" y="168" class="tiny">DATA BOUNDARY</text>
    <text x="732" y="207" class="title" font-size="22">Redacted by contract</text>
    <text x="732" y="237" class="muted" font-size="13">private note · raw location · token</text>
    <rect x="732" y="250" width="152" height="5" rx="2" fill="url(#accent)"/>

    <rect x="0" y="311" width="690" height="235" rx="20" class="card"/>
    <text x="26" y="348" class="tiny">MOOD / RHYTHM WINDOW</text>
    <text x="26" y="382" class="title" font-size="20">A bounded view of change over time</text>
    <line x1="32" y1="492" x2="652" y2="492" stroke="#2b3a47"/>
    <line x1="32" y1="446" x2="652" y2="446" stroke="#1f2b35"/>
    <line x1="32" y1="400" x2="652" y2="400" stroke="#1f2b35"/>
    <path d="M40 470 C90 451 106 474 150 430 S224 446 267 413 S330 440 374 396 S440 420 482 389 S544 415 594 365 S620 382 650 350" fill="none" stroke="#ff7f93" stroke-width="4" stroke-linecap="round"/>
    <path d="M40 470 C90 451 106 474 150 430 S224 446 267 413 S330 440 374 396 S440 420 482 389 S544 415 594 365 S620 382 650 350 L650 492 L40 492 Z" fill="#ff7f93" opacity=".08"/>
    <text x="34" y="526" class="muted" font-size="11">08/16</text><text x="185" y="526" class="muted" font-size="11">08/18</text><text x="340" y="526" class="muted" font-size="11">08/20</text><text x="496" y="526" class="muted" font-size="11">08/22</text>

    <rect x="708" y="311" width="388" height="235" rx="20" class="card"/>
    <text x="732" y="348" class="tiny">EVENT LINEAGE</text>
    <circle cx="745" cy="393" r="6" fill="#73d6b2"/><text x="764" y="398" class="body" font-size="14">projection accepted</text><text x="764" y="418" class="muted" font-size="11">receipt-bound · 09:42</text>
    <line x1="745" y1="402" x2="745" y2="453" stroke="#344552" stroke-width="2"/>
    <circle cx="745" cy="466" r="6" fill="#f1bd72"/><text x="764" y="471" class="body" font-size="14">daily snapshot updated</text><text x="764" y="491" class="muted" font-size="11">source timestamp preserved</text>
    <rect x="732" y="514" width="180" height="20" rx="10" fill="#18262d"/><text x="742" y="528" class="sans" fill="#9fe4ca" font-size="10">READ-ONLY OBSERVER SURFACE</text>
  </g>
</svg>
