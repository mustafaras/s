<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ÆON Panel-v2 Premium interface preview</title>
  <desc id="desc">A premium observer dashboard preview with a hero status, metric tiles, trend visualisation, timeline and explicit privacy state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11100f"/><stop offset="1" stop-color="#211b1c"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9ae63"/><stop offset="1" stop-color="#f18b87"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".36"/></filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .title{fill:#fbf7f2;font-weight:700;letter-spacing:-.03em}
      .body{fill:#e1d9d2}
      .muted{fill:#a49791}
      .tiny{fill:#a49791;font-size:11px;letter-spacing:.15em}
      .card{fill:#1c1818;stroke:#3a302f;stroke-width:1}
    </style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <rect x="30" y="30" width="1140" height="700" rx="24" fill="#151211" stroke="#403332"/>
  <rect x="52" y="52" width="188" height="656" rx="18" fill="#191514"/>
  <text x="78" y="92" class="sans title" font-size="18">ÆON</text>
  <text x="78" y="113" class="sans muted" font-size="10" letter-spacing=".12em">PANEL-V2 PREMIUM</text>
  <rect x="70" y="154" width="152" height="42" rx="12" fill="#d8936d" opacity=".15"/><circle cx="88" cy="175" r="4" fill="#e9ae63"/><text x="104" y="180" class="sans body" font-size="13">Today</text>
  <text x="88" y="236" class="sans muted" font-size="13">Trends</text>
  <text x="88" y="278" class="sans muted" font-size="13">Day detail</text>
  <text x="88" y="320" class="sans muted" font-size="13">Archives</text>
  <text x="88" y="362" class="sans muted" font-size="13">System</text>
  <text x="88" y="404" class="sans muted" font-size="13">Settings</text>
  <line x1="76" y1="638" x2="216" y2="638" stroke="#3a302f"/><text x="78" y="670" class="sans muted" font-size="10" letter-spacing=".1em">SOURCE-AWARE UI</text>

  <g transform="translate(274 62)" class="sans">
    <text x="0" y="18" class="tiny">TODAY / OBSERVER BRIEF</text>
    <text x="0" y="61" class="title" font-size="36">A calm view of the signal.</text>
    <text x="0" y="88" class="muted" font-size="14">22 August 2026 · seven-day window · read-only projection</text>
    <rect x="774" y="0" width="130" height="30" rx="15" fill="#24352d" stroke="#4b715c"/><circle cx="792" cy="15" r="4" fill="#9edbb9"/><text x="803" y="19" fill="#bde8ca" font-size="10">FRESH SOURCE</text>

    <rect x="0" y="120" width="904" height="152" rx="22" fill="url(#gold)" opacity=".95" filter="url(#shadow)"/>
    <rect x="1" y="121" width="902" height="150" rx="21" fill="#261c1a" opacity=".83"/>
    <text x="28" y="158" class="tiny" fill="#d7bda0">OBSERVATION SUMMARY</text>
    <text x="28" y="204" class="title" font-size="31">Stable rhythm, low-friction care.</text>
    <text x="28" y="235" class="body" font-size="14">A projection-level reading, intentionally bounded by source freshness and privacy policy.</text>
    <rect x="715" y="160" width="158" height="64" rx="16" fill="#342523" stroke="#60403b"/><text x="735" y="187" class="tiny">CONFIDENCE</text><text x="735" y="212" class="title" font-size="23">Contextual</text>

    <rect x="0" y="301" width="210" height="122" rx="18" class="card"/><text x="22" y="335" class="tiny">MOOD INDEX</text><text x="22" y="382" class="title" font-size="32">4.0</text><text x="103" y="379" class="muted" font-size="13">/ 5</text><text x="22" y="404" fill="#9edbb9" font-size="11">+0.4 vs prior window</text>
    <rect x="228" y="301" width="210" height="122" rx="18" class="card"/><text x="250" y="335" class="tiny">SLEEP</text><text x="250" y="382" class="title" font-size="32">7h 42m</text><text x="250" y="404" fill="#9edbb9" font-size="11">within personal range</text>
    <rect x="456" y="301" width="210" height="122" rx="18" class="card"/><text x="478" y="335" class="tiny">WATER</text><text x="478" y="382" class="title" font-size="32">6 / 8</text><text x="478" y="404" fill="#e9c27a" font-size="11">target is gentle, not a score</text>
    <rect x="684" y="301" width="220" height="122" rx="18" class="card"/><text x="706" y="335" class="tiny">PRIVACY</text><text x="706" y="377" class="title" font-size="20">Redacted</text><text x="706" y="404" class="muted" font-size="11">private detail withheld</text>

    <rect x="0" y="452" width="570" height="205" rx="20" class="card"/>
    <text x="24" y="487" class="tiny">TREND SURFACE</text><text x="24" y="519" class="title" font-size="18">Mood movement · 7 days</text>
    <line x1="28" y1="612" x2="542" y2="612" stroke="#3a302f"/><line x1="28" y1="566" x2="542" y2="566" stroke="#2b2423"/><line x1="28" y1="524" x2="542" y2="524" stroke="#2b2423"/>
    <path d="M38 590 C75 570 97 582 124 552 S178 574 213 545 S265 564 299 531 S350 550 383 524 S436 548 470 508 S510 520 534 492" fill="none" stroke="#e9ae63" stroke-width="4" stroke-linecap="round"/>
    <path d="M38 590 C75 570 97 582 124 552 S178 574 213 545 S265 564 299 531 S350 550 383 524 S436 548 470 508 S510 520 534 492 L534 612 L38 612 Z" fill="#e9ae63" opacity=".09"/>
    <text x="32" y="640" class="muted" font-size="10">16 Aug</text><text x="177" y="640" class="muted" font-size="10">18 Aug</text><text x="322" y="640" class="muted" font-size="10">20 Aug</text><text x="470" y="640" class="muted" font-size="10">22 Aug</text>
    <rect x="592" y="452" width="312" height="205" rx="20" class="card"/>
    <text x="616" y="487" class="tiny">AUDIT TRAIL</text>
    <circle cx="630" cy="530" r="5" fill="#9edbb9"/><text x="648" y="534" class="body" font-size="13">snapshot accepted</text><text x="648" y="552" class="muted" font-size="10">receipt-bound · 09:42</text>
    <circle cx="630" cy="585" r="5" fill="#e9ae63"/><text x="648" y="589" class="body" font-size="13">source timestamp retained</text><text x="648" y="607" class="muted" font-size="10">no raw detail exposed</text>
    <rect x="616" y="625" width="176" height="19" rx="9" fill="#2b2220"/><text x="625" y="638" fill="#d7bda0" font-size="9">EVIDENCE LEVEL: PROJECTION</text>
  </g>
</svg>
