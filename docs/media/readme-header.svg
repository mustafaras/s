<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">ŞEYMA 🦩 and ÆON project header</title>
  <desc id="desc">A premium flamingo-inspired typographic header with flowing signal lines representing private observation, evidence and protected context.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset=".52" stop-color="#1a1a2a"/>
      <stop offset="1" stop-color="#2b1d2a"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#73d6b2"/>
      <stop offset=".48" stop-color="#8fbce9"/>
      <stop offset="1" stop-color="#ff7c8d"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9bb70"/>
      <stop offset=".58" stop-color="#ff9b86"/>
      <stop offset="1" stop-color="#ff6f9a"/>
    </linearGradient>
    <radialGradient id="flamingoAura" cx="50%" cy="50%" r="58%">
      <stop offset="0" stop-color="#ff9fb0" stop-opacity=".36"/>
      <stop offset=".55" stop-color="#e85f8b" stop-opacity=".12"/>
      <stop offset="1" stop-color="#e85f8b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .wordmark{fill:#fbf8f3;font-weight:760;letter-spacing:-.055em}
      .brandEmoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;letter-spacing:0}
      .eyebrow{fill:#abb4c2;font-size:14px;letter-spacing:.22em}
      .subtitle{fill:#d7dce4;font-size:20px;letter-spacing:.005em}
      .micro{fill:#8994a4;font-size:11px;letter-spacing:.16em}
    </style>
  </defs>
  <rect width="1600" height="480" rx="32" fill="url(#surface)"/>
  <rect x="1" y="1" width="1598" height="478" rx="31" fill="none" stroke="#354154"/>
  <path d="M0 382 C190 322 282 424 463 364 S765 254 951 322 S1255 422 1600 255" fill="none" stroke="#fff" stroke-opacity=".035" stroke-width="1"/>
  <path d="M0 410 C194 350 304 445 488 377 S772 281 965 343 S1284 443 1600 280" fill="none" stroke="#fff" stroke-opacity=".035" stroke-width="1"/>
  <g transform="translate(826 48) scale(.62)" aria-label="Flamingo mark">
    <circle cx="42" cy="42" r="54" fill="url(#flamingoAura)"/>
    <path d="M36 76 C31 67 28 58 33 49 C37 42 48 38 49 27 C50 18 45 10 39 8 C33 6 27 10 27 16 C27 20 30 22 34 22" fill="none" stroke="#ff91a7" stroke-width="5" stroke-linecap="round"/>
