    <ellipse cx="39" cy="61" rx="22" ry="15" fill="#e96d96" fill-opacity=".24" stroke="#ff91a7" stroke-width="3"/>
    <path d="M24 59 C34 48 48 48 56 59 C45 57 36 62 24 59Z" fill="#ffb0bd" fill-opacity=".72"/>
    <path d="M33 74 L27 93 M45 74 L51 93" fill="none" stroke="#e9bb70" stroke-width="3" stroke-linecap="round"/>
    <path d="M23 94 H31 M47 94 H55" fill="none" stroke="#e9bb70" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g opacity=".42" stroke="#718098" stroke-width="1">
    <path d="M1010 76V402M1090 76V402M1170 76V402M1250 76V402M1330 76V402M1410 76V402M1490 76V402"/>
    <path d="M972 116H1542M972 176H1542M972 236H1542M972 296H1542M972 356H1542"/>
  </g>
  <g opacity=".94" filter="url(#glow)">
    <path d="M978 320 C1032 295 1047 310 1091 273 S1166 286 1214 230 S1284 250 1332 192 S1406 230 1450 151 S1511 185 1542 114" fill="none" stroke="url(#signal)" stroke-width="4" stroke-linecap="round"/>
    <path d="M978 354 C1030 340 1053 356 1094 330 S1169 349 1210 306 S1285 324 1333 287 S1404 310 1450 256 S1505 273 1542 232" fill="none" stroke="url(#warm)" stroke-width="2" stroke-linecap="round" opacity=".92"/>
  </g>
  <g fill="#f4f0ea">
    <circle cx="978" cy="320" r="5"/><circle cx="1214" cy="230" r="5"/><circle cx="1450" cy="151" r="5"/><circle cx="1542" cy="114" r="5"/>
  </g>
  <g class="sans">
    <text x="94" y="104" class="eyebrow">PRIVATE SIGNALS / EVIDENCE-FIRST OBSERVATION</text>
    <text x="88" y="226" class="wordmark" font-size="92">ŞEYMA</text>
    <text x="398" y="226" class="wordmark brandEmoji" font-size="56">🦩</text>
    <text x="470" y="226" class="wordmark" font-size="92">· ÆON</text>
    <text x="96" y="278" class="subtitle">A quiet system for noticing patterns without flattening a life into a score.</text>
    <rect x="96" y="334" width="198" height="34" rx="17" fill="#3b2935" stroke="#87506a"/>
    <circle cx="116" cy="351" r="5" fill="#ff91a7"/><text x="131" y="355" fill="#ffc1cb" font-size="11" letter-spacing=".12em">FLAMINGO-LED</text>
    <rect x="310" y="334" width="198" height="34" rx="17" fill="#2c283e" stroke="#5a4e80"/>
    <circle cx="330" cy="351" r="5" fill="#b9a0ff"/><text x="345" y="355" fill="#d2c6ff" font-size="11" letter-spacing=".12em">EVIDENCE-GATED</text>
    <text x="96" y="414" class="micro">STATIC WEB · DETERMINISTIC QA · PROTECTED CONTEXT</text>
    <text x="1504" y="80" text-anchor="end" class="micro">README / SYSTEM BRIEF</text>
    <text x="1504" y="425" text-anchor="end" class="micro">OBSERVE → PROTECT → PROJECT → VERIFY</text>
