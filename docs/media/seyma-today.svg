<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Şeyma Today interface preview</title>
  <desc id="desc">A dark premium mobile-first mood and daily-life tracking interface with a mood card, daily rhythm cards and a private note surface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset="1" stop-color="#17151e"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#32232f"/>
      <stop offset="1" stop-color="#1a2832"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .title{fill:#f7f4f0;font-weight:700;letter-spacing:-.02em}
      .body{fill:#d5d9df}
      .muted{fill:#84909e}
      .tiny{fill:#84909e;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
      .card{fill:#141d26;stroke:#26323e;stroke-width:1}
    </style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="704" rx="24" fill="#0f151d" stroke="#2b3540"/>
  <rect x="48" y="48" width="218" height="664" rx="18" fill="#121a22"/>
  <circle cx="88" cy="91" r="24" fill="#ff7c8d" opacity=".16"/>
  <text x="88" y="99" text-anchor="middle" class="sans title" font-size="21">Ş</text>
  <text x="126" y="88" class="sans title" font-size="18">ŞEYMA</text>
  <text x="126" y="108" class="sans muted" font-size="12">private daily rhythm</text>
  <g class="sans" font-size="14">
    <rect x="66" y="158" width="182" height="46" rx="13" fill="#ff7c8d" opacity=".14"/>
    <circle cx="89" cy="181" r="5" fill="#ff7c8d"/>
    <text x="108" y="186" class="title">Bugün</text>
    <text x="89" y="240" class="muted">Rapor</text>
    <text x="89" y="286" class="muted">İlham &amp; İbadet</text>
    <text x="89" y="332" class="muted">Kütüphane</text>
    <text x="89" y="378" class="muted">Hatırlatmalar</text>
  </g>
  <line x1="70" y1="630" x2="244" y2="630" stroke="#293541"/>
  <text x="70" y="664" class="sans muted" font-size="12">LOCAL-FIRST • OPTIONAL SYNC</text>

  <g transform="translate(302 64)" class="sans">
    <text x="0" y="20" class="tiny">ŞEYMA / BUGÜN</text>
    <text x="0" y="64" class="title" font-size="38">Sakin bir başlangıç.</text>
    <text x="0" y="92" class="muted" font-size="16">Salı · 22 Ağustos 2026 · yalnızca senin için</text>

    <rect x="0" y="124" width="538" height="212" rx="22" fill="url(#hero)" stroke="#4b3546" filter="url(#shadow)"/>
    <text x="30" y="162" class="tiny">BUGÜNÜN SİNYALİ</text>
    <text x="30" y="205" class="title" font-size="25">Nasıl hissediyorsun?</text>
    <text x="30" y="240" class="muted" font-size="15">Kendine tek bir kelimeyle alan aç.</text>
    <text x="30" y="300" class="title" font-size="46">4.0</text>
    <text x="108" y="296" class="body" font-size="15">/ 5 · dengeli</text>
    <path d="M374 284 C394 250 413 270 431 238 S468 194 488 214 S513 244 526 187" fill="none" stroke="#ff7c8d" stroke-width="4" stroke-linecap="round"/>
    <circle cx="526" cy="187" r="6" fill="#ff7c8d"/>

    <text x="0" y="382" class="tiny">GÜNÜN RİTMİ</text>
    <rect x="0" y="404" width="168" height="122" rx="18" class="card"/>
    <text x="22" y="438" class="muted" font-size="13">Uyku</text>
    <text x="22" y="480" class="title" font-size="27">7h 42m</text>
    <text x="22" y="505" fill="#73d6b2" font-size="12">iyi toparlanma</text>
    <rect x="184" y="404" width="168" height="122" rx="18" class="card"/>
    <text x="206" y="438" class="muted" font-size="13">Su</text>
    <text x="206" y="480" class="title" font-size="27">6 / 8</text>
    <text x="206" y="505" fill="#89bff1" font-size="12">nazik hedef</text>
    <rect x="368" y="404" width="170" height="122" rx="18" class="card"/>
    <text x="390" y="438" class="muted" font-size="13">Bugünün niyeti</text>
    <text x="390" y="480" class="title" font-size="22">yavaşla</text>
    <text x="390" y="505" fill="#e5bf77" font-size="12">kişisel alan</text>

    <rect x="0" y="560" width="538" height="104" rx="18" fill="#151d27" stroke="#26323e"/>
    <text x="24" y="592" class="tiny">ŞEFKATLİ NOT</text>
    <text x="24" y="626" class="body" font-size="16">Bugün kendime acele etmeden eşlik ediyorum.</text>
    <text x="24" y="650" class="muted" font-size="12">Bu alan cihazında kalır.</text>
  </g>

  <g transform="translate(870 64)" class="sans">
    <rect width="270" height="600" rx="22" fill="#121b24" stroke="#283540"/>
    <text x="26" y="42" class="tiny">PRIVATE BY DEFAULT</text>
    <text x="26" y="82" class="title" font-size="23">Günün akışı</text>
    <circle cx="40" cy="130" r="7" fill="#73d6b2"/>
    <text x="62" y="135" class="body" font-size="14">Sabah ritüeli</text>
    <text x="62" y="155" class="muted" font-size="12">tamamlandı</text>
    <line x1="40" y1="145" x2="40" y2="218" stroke="#344352" stroke-width="2"/>
    <circle cx="40" cy="236" r="7" fill="#ff7c8d"/>
    <text x="62" y="241" class="body" font-size="14">Duygu check-in</text>
    <text x="62" y="261" class="muted" font-size="12">isteğe bağlı</text>
    <line x1="40" y1="251" x2="40" y2="324" stroke="#344352" stroke-width="2"/>
    <circle cx="40" cy="342" r="7" fill="#e5bf77"/>
    <text x="62" y="347" class="body" font-size="14">Akşam kapanışı</text>
    <text x="62" y="367" class="muted" font-size="12">henüz başlamadı</text>
    <rect x="26" y="432" width="218" height="112" rx="16" fill="#1b2630"/>
    <text x="44" y="466" class="tiny">REMINDER CENTER</text>
    <text x="44" y="496" class="body" font-size="14">Hatırlatmaların kontrolü</text>
    <text x="44" y="520" class="muted" font-size="12">local · optional · non-judgmental</text>
  </g>
</svg>
