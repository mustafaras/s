<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kur'an Yolculuğu · Güvenli Akış Demosu</title>
  <style>
    :root{--paper:#f6f2e8;--surface:#fffdf7;--ink:#172b45;--muted:#657184;--blue:#1c3a5f;--gold:#b28b1e;--line:#d9d3c4;--soft:#e9edf0;--ok:#2e703a;--warn:#8a5a3a;--shadow:0 18px 48px rgba(23,43,69,.13)}
    *{box-sizing:border-box;letter-spacing:0}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:ui-rounded,"Avenir Next",Avenir,sans-serif}
    button,input{font:inherit}.shell{width:min(100%,460px);min-height:100vh;margin:auto;background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow)}
    header{padding:18px 18px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:14px;background:var(--soft);font-size:20px}.headcopy{flex:1;min-width:0}.headcopy strong{display:block;font-size:17px}.headcopy small{display:block;margin-top:2px;color:var(--muted);font-size:11px;font-weight:700}.demo-badge{padding:6px 9px;border-radius:99px;background:#fff3c9;color:#6c5410;font-size:9px;font-weight:900}
    .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--paper)}.step{min-width:0;padding:8px 2px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:10px;font-weight:850;cursor:pointer}.step span{display:grid;place-items:center;width:23px;height:23px;margin:0 auto 4px;border:1px solid var(--line);border-radius:50%;background:var(--surface)}.step.on{background:var(--blue);color:#fff}.step.on span{border-color:transparent;background:var(--gold);color:var(--ink)}
    main{flex:1;padding:18px;overflow:auto}.notice{display:flex;gap:9px;padding:11px 12px;border-left:4px solid var(--gold);border-radius:3px 12px 12px 3px;background:#f1eee5;color:var(--muted);font-size:11px;line-height:1.45}.notice b{color:var(--ink)}
    .panel{margin-top:16px;border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden;box-shadow:0 10px 28px rgba(23,43,69,.08)}.panel-head{padding:14px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:#f3f1eb}.panel-head .ico{width:35px;height:35px;display:grid;place-items:center;border-radius:11px;background:var(--soft)}.panel-head div{flex:1}.panel-head strong{display:block;font-size:14px}.panel-head small{display:block;margin-top:2px;color:var(--muted);font-size:10px}.panel-body{padding:16px}
    .surah{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:12px}.order{text-align:center}.order b{display:block;font:800 21px Georgia,serif;color:var(--blue)}.order small{font-size:8px;font-weight:900;color:var(--muted)}.surah h2{margin:0;font:800 22px Georgia,serif}.surah p{margin:5px 0 0;color:var(--muted);font-size:11px}.arabic{font-family:"Noto Naskh Arabic","Times New Roman",serif;font-size:24px;color:#715b14}.status{margin-top:15px;padding:11px 12px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px}.status b{color:var(--warn)}
    .primary,.secondary{width:100%;min-height:50px;margin-top:14px;border-radius:14px;font-weight:850;cursor:pointer}.primary{border:0;background:var(--blue);color:#fff}.secondary{border:1px solid var(--line);background:var(--surface);color:var(--blue)}
    .email{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.mail-meta{display:grid;grid-template-columns:58px 1fr;gap:7px 10px;padding-bottom:13px;border-bottom:1px solid var(--line);font-size:10px}.mail-meta span{color:var(--muted)}.mail-meta b{overflow-wrap:anywhere}.mail-body{white-space:pre-wrap;margin-top:14px;font-size:11px;line-height:1.65;color:#303b4a}.token-note{margin-top:12px;color:var(--muted);font:10px/1.45 ui-rounded,"Avenir Next",sans-serif}
    label{display:block;font-size:11px;font-weight:850;color:var(--muted)}input{width:100%;margin-top:7px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#f8f7f2;color:var(--ink);outline:none}input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(178,139,30,.13)}.checks{display:grid;gap:7px;margin-top:14px}.check{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted)}.check i{width:20px;height:20px;display:grid;place-items:center;border-radius:50%;background:#e7f3e9;color:var(--ok);font-style:normal;font-weight:900}
    .video-card{border:1px solid var(--line);border-radius:16px;overflow:hidden}.video-cover{aspect-ratio:16/9;display:grid;place-items:center;background:#14243a;color:#fff;position:relative}.video-cover::before{content:"";position:absolute;inset:14px;border:1px solid rgba(201,162,39,.35)}.play{position:relative;width:58px;height:58px;border:1px solid rgba(255,255,255,.35);border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);font-size:20px}.video-copy{padding:13px 14px}.video-copy small{display:block;color:var(--gold);font-size:9px;font-weight:900}.video-copy strong{display:block;margin-top:4px;font-size:15px}.video-copy p{margin:5px 0 0;color:var(--muted);font-size:10.5px;line-height:1.45}.mock-player{aspect-ratio:16/9;display:grid;place-items:center;background:#0d1724;color:#d7deea;text-align:center;padding:20px;font-size:12px;line-height:1.5}.ready{color:var(--ok)!important}
    @media(max-width:380px){main{padding:14px}.surah{grid-template-columns:46px 1fr}.arabic{grid-column:2;text-align:right}.steps{padding-inline:8px}.step{font-size:9px}}
  </style>
</head>
<body>
  <div class="shell">
    <header><span class="mark">📖</span><span class="headcopy"><strong>Kur'an Yolculuğu</strong><small>İstek → mail → cevap → kullanıcı</small></span><span class="demo-badge">GÜVENLİ DEMO</span></header>
    <nav class="steps" aria-label="Demo aşamaları">
      <button class="step on" data-step="0"><span>1</span>İstek</button><button class="step" data-step="1"><span>2</span>Mail</button><button class="step" data-step="2"><span>3</span>Cevap</button><button class="step" data-step="3"><span>4</span>Kullanıcı</button>
    </nav>
    <main id="stage"></main>
  </div>
  <script>
    (function(){
      'use strict';
      var state={step:0,videoId:'DEMO1234567',played:false};
      var subject='[KURAN-REQ:qr_DEMO12345678:demo_token_not_real_12345678901234567890] 3. Durak · Müzzemmil';
      var body='Raşit, Kur’an Yolculuğu için yeni bir anlatım isteği var.\n\nSûre: Müzzemmil\nNüzul sırası: 3\nMushaf sırası: 73\nİstek zamanı: 01.08.2026 17:45\n\nBu e-postaya yalnızca tek bir YouTube video bağlantısıyla yanıt vermen yeterli.';
      function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}
      function notice(){return '<div class="notice"><span>🛡️</span><span><b>İzole önizleme:</b> Bu sayfa mail göndermez, GitHub’a bağlanmaz, token veya kullanıcı verisi kullanmaz. Her şey yalnızca bu sekmenin belleğinde simüle edilir.</span></div>';}
      function requestView(){return notice()+'<section class="panel"><div class="panel-head"><span class="ico">✦</span><div><strong>Şeyma kullanıcısı</strong><small>Sûre ayrıntısından istek açıyor</small></div></div><div class="panel-body"><div class="surah"><span class="order"><b>3</b><small>DURAK</small></span><span><h2>Müzzemmil</h2><p>Mekkî · 20 âyet · Mushaf 73</p></span><span class="arabic" lang="ar" dir="rtl">المزمل</span></div><div class="status"><span>Durum</span><b>İstenmedi</b></div><button class="primary" id="request">Raşit’ten iste</button></div></section>';}
      function mailView(){return notice()+'<section class="panel email"><div class="panel-head"><span class="ico">✉</span><div><strong>Gelen mail</strong><small>GitHub Actions aynı isteği yalnız bir kez yollar</small></div></div><div class="panel-body"><div class="mail-meta"><span>KİMDEN</span><b>Şeyma · Kur’an Yolculuğu</b><span>KONU</span><b>'+esc(subject)+'</b></div><div class="mail-body">'+esc(body)+'</div><div class="token-note">Konu satırındaki requestId ve reply token, cevabın doğru sûreye eşlenmesini sağlar. Gerçek kullanıcı ekranında token görünmez.</div><button class="primary" id="reply">Tek linkle yanıtla</button></div></section>';}
      function replyView(){return notice()+'<section class="panel"><div class="panel-head"><span class="ico">↩</span><div><strong>Raşit’in cevabı</strong><small>Aynı mail thread’ine yalnız tek YouTube bağlantısı</small></div></div><div class="panel-body"><label>YouTube bağlantısı<input id="video-url" value="https://youtu.be/'+esc(state.videoId)+'" spellcheck="false"></label><div class="checks"><div class="check"><i>✓</i>İzinli gönderen adresi</div><div class="check"><i>✓</i>requestId + reply token eşleşmesi</div><div class="check"><i>✓</i>Tek video bağlantısı</div><div class="check"><i>✓</i>Doğru sûre: Müzzemmil</div></div><button class="primary" id="process">Cevabı işle</button></div></section>';}
      function userView(){return notice()+'<section class="panel"><div class="panel-head"><span class="ico">✓</span><div><strong>Şeyma kullanıcısında</strong><small>Yenile sonrası doğrulanmış video kartı</small></div><span class="demo-badge ready">HAZIR</span></div><div class="panel-body"><div class="video-card">'+(state.played?'<div class="mock-player">▶<br>Gerçek akışta güvenli<br><b>youtube-nocookie.com</b><br>oynatıcısı burada açılır.</div>':'<button class="video-cover" id="play" aria-label="Demo anlatımı oynat"><span class="play">▶</span></button>')+'<div class="video-copy"><small>RAŞİT’İN ANLATIMI HAZIR</small><strong>Müzzemmil Sûresi · 3. durak</strong><p>Video ilk yüklemede otomatik açılmaz. Kullanıcı “İzlemeye başla” dediğinde click-to-load çalışır.</p></div></div>'+(!state.played?'<button class="primary" id="play-action">İzlemeye başla</button>':'<button class="secondary" id="reset">Demoyu baştan göster</button>')+'</div></section>';}
      function setStep(n){state.step=n;document.querySelectorAll('.step').forEach(function(b){b.classList.toggle('on',Number(b.dataset.step)===n);});render();}
      function render(){var html=[requestView,mailView,replyView,userView][state.step]();document.getElementById('stage').innerHTML=html;wire();}
      function wire(){var el;if((el=document.getElementById('request')))el.onclick=function(){setStep(1);};if((el=document.getElementById('reply')))el.onclick=function(){setStep(2);};if((el=document.getElementById('process')))el.onclick=function(){var v=document.getElementById('video-url').value.trim(),m=v.match(/(?:youtu\.be\/|[?&]v=)([A-Za-z0-9_-]{11})/);if(!m){alert('Demo için tek ve geçerli 11 karakterli YouTube video kimliği gerekli.');return;}state.videoId=m[1];setStep(3);};if((el=document.getElementById('play')))el.onclick=play;if((el=document.getElementById('play-action')))el.onclick=play;if((el=document.getElementById('reset')))el.onclick=function(){state.played=false;setStep(0);};}
      function play(){state.played=true;render();}
      document.querySelectorAll('.step').forEach(function(b){b.onclick=function(){setStep(Number(b.dataset.step));};});
      render();
    })();
  </script>
</body>
</html>
